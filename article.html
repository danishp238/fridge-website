<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Article • FrostLogic</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="styles.css">
</head>
<body class="antialiased text-gray-800">
    
    <!-- Header -->
    <header id="header"></header>

    <!-- Article Content -->
    <main class="py-12 px-4 sm:px-6 lg:px-8">
        <div id="articleContent" class="max-w-7xl mx-auto">
            <!-- Article loads dynamically here -->
        </div>
        
        <!-- Related Products -->
        <div class="max-w-7xl mx-auto mt-16 pt-12 border-t border-gray-200">
            <h2 class="text-2xl font-bold text-gray-900 mb-6">Related Products</h2>
            <div id="relatedProducts" class="grid grid-cols-1 md:grid-cols-3 gap-6">
                <!-- Related products will be loaded here -->
            </div>
        </div>
    </main>

    <!-- Enhanced Footer -->
    <footer id="footer"></footer>

    <script src="script.js"></script>
    <script>
        // Load related products based on current article
        document.addEventListener('DOMContentLoaded', () => {
            const urlParams = new URLSearchParams(window.location.search);
            const slug = urlParams.get('slug');
            
            if (slug && articles[slug]) {
                const article = articles[slug];
                const relatedProducts = products
                    .filter(p => p.category === article.category && p.slug !== slug)
                    .slice(0, 3);
                
                const relatedContainer = document.getElementById('relatedProducts');
                if (relatedContainer) {
                    relatedContainer.innerHTML = relatedProducts.map(product => createProductCard(product)).join('');
                }
            }
        });
    </script>
</body>
</html>
